name: Tests

# WANNEER draait dit? Bij elke pull request, en met de hand (Actions → Tests → Run workflow).
# Bewust NIET bij een push naar main: de dagelijkse data-run pusht daar zelf naartoe, en dan
# zou dit elke dag onnodig draaien. (Een push met de ingebouwde GITHUB_TOKEN start sowieso
# geen andere workflow; dat is een vangrail van GitHub tegen eindeloze lussen.)
on:
  pull_request:
  workflow_dispatch:

# WAT mag hij? Alleen lezen. Deze workflow hoeft niets te schrijven, dus krijgt hij dat
# recht ook niet (het principe van de minste rechten). Vergelijk met update.yml, die
# `contents: write` nodig heeft om de data te committen.
permissions:
  contents: read

# Een nieuwe push naar dezelfde PR annuleert de nog lopende run ervan: alleen de nieuwste
# stand telt. (Bij update.yml staat dit juist op false: een afgekapte fetch laat een
# half bijgewerkt cachebestand achter. Hier is afkappen onschuldig.)
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # De naam van elke variant komt uit de matrix. Dat is ook de naam die je op de PR ziet,
    # en later (bij "vereiste checks") de naam waarop je een regel zet.
    name: tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15         # vangnet: een vastgelopen run kost geen uren

    # DE MATRIX: dezelfde job, meerdere keren, elk met andere waarden. We draaien de tests
    # in de TWEE omgevingen waar deze code echt leeft, niet in alle denkbare combinaties:
    #   - Linux, Python 3.12, Node 22: zo draait de dagelijkse data-run (update.yml) in
    #     productie. fetch_data.py loopt daar dus elke dag op Linux; dat is de omgeving die
    #     ertoe doet, ook al ontwikkel je op Windows.
    #   - Windows, Python 3.13, Node 24: jouw eigen pc. Hier worden de tests geschreven en
    #     lokaal gedraaid.
    # Met `include` geef je elke combinatie met de hand op. Zonder `include` maakt GitHub
    # het volledige kruisproduct: 2 besturingssystemen × 2 Python × 2 Node = 8 jobs, de
    # meeste daarvan zonder dat iemand ze nodig heeft.
    strategy:
      fail-fast: false          # faalt de ene variant, laat de andere dan gewoon afmaken:
                                # je wilt zien OF het aan het besturingssysteem ligt
      matrix:
        include:
          - label: Linux, Python 3.12, Node 22 (like the data run)
            os: ubuntu-latest
            python: '3.12'
            node: '22'
          - label: Windows, Python 3.13, Node 24 (like this PC)
            os: windows-latest
            python: '3.13'
            node: '24'

    # De standaardshell verschilt per systeem: op Linux is dat bash, op Windows PowerShell.
    # De lus en de pijp (|) in de stappen hieronder zijn bash. Met één regel hier draaien ze
    # op beide systemen hetzelfde (Windows-runners hebben Git Bash).
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # fetch_data.py draait hier volledig tegen een nagebootste keten met opgeslagen
      # testdata: geen netwerk, geen sleutel. PYTHONUTF8 omdat de logregels pijltjes (→) bevatten
      # (op Windows is de standaardtekenset anders, daar zou dat zonder deze regel breken).
      - name: Python tests (fetch_data.py against a fake chain)
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests

      - name: JS tests (browser modules)
        run: node --test tests/js/browser_modules.test.mjs tests/js/daily_history.test.mjs

      # De tests hierboven laden maar een paar modules; een typefout in bijvoorbeeld canvas.js
      # zou ze allemaal laten slagen. Een syntaxcontrole van ELK bestand vangt dat wel.
      # Alle fouten worden getoond (niet alleen de eerste), daarna pas faalt de stap.
      - name: Syntax check of every browser module
        run: |
          fail=0
          for f in modules/*.js; do
            node --check "$f" || fail=1
          done
          exit $fail

      - name: Compile every Python file
        run: git ls-files '*.py' | xargs python -m py_compile
