name: Tests

# WANNEER draait dit? Bij elke pull request, en met de hand (Actions → Tests → Run workflow).
# Bewust NIET bij een push naar main: de dagelijkse data-run pusht daar zelf naartoe, en dan
# zou dit elke dag onnodig draaien. (Een push met de ingebouwde GITHUB_TOKEN start sowieso
# geen andere workflow; dat is een vangrail van GitHub tegen eindeloze lussen.)
on:
  pull_request:
  workflow_dispatch:

# WAT mag hij? Alleen lezen. Deze workflow hoeft niets te schrijven, dus krijgt hij dat
# recht ook niet (het principe van de minste rechten). Vergelijk met update.yml, die
# `contents: write` nodig heeft om de data te committen.
permissions:
  contents: read

# Een nieuwe push naar dezelfde PR annuleert de nog lopende run ervan: alleen de nieuwste
# stand telt. (Bij update.yml staat dit juist op false: een afgekapte fetch laat een
# half bijgewerkt cachebestand achter. Hier is afkappen onschuldig.)
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # De naam van elke variant komt uit de matrix. Dat is ook de naam die je op de PR ziet,
    # en later (bij "vereiste checks") de naam waarop je een regel zet.
    name: tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15         # vangnet: een vastgelopen run kost geen uren

    # DE MATRIX: dezelfde job, meerdere keren, elk met andere waarden. We draaien de tests
    # in de TWEE omgevingen waar deze code echt leeft, niet in alle denkbare combinaties:
    #   - Linux, Python 3.12, Node 22: zo draait de dagelijkse data-run (update.yml) in
    #     productie. fetch_data.py loopt daar dus elke dag op Linux; dat is de omgeving die
    #     ertoe doet, ook al ontwikkel je op Windows.
    #   - Windows, Python 3.13, Node 24: jouw eigen pc. Hier worden de tests geschreven en
    #     lokaal gedraaid.
    # Met `include` geef je elke combinatie met de hand op. Zonder `include` maakt GitHub
    # het volledige kruisproduct: 2 besturingssystemen × 2 Python × 2 Node = 8 jobs, de
    # meeste daarvan zonder dat iemand ze nodig heeft.
    strategy:
      fail-fast: false          # faalt de ene variant, laat de andere dan gewoon afmaken:
                                # je wilt zien OF het aan het besturingssysteem ligt
      matrix:
        include:
          - label: Linux, Python 3.12, Node 22 (like the data run)
            os: ubuntu-latest
            python: '3.12'
            node: '22'
          - label: Windows, Python 3.13, Node 24 (like this PC)
            os: windows-latest
            python: '3.13'
            node: '24'

    # De standaardshell verschilt per systeem: op Linux is dat bash, op Windows PowerShell.
    # De lus en de pijp (|) in de stappen hieronder zijn bash. Met één regel hier draaien ze
    # op beide systemen hetzelfde (Windows-runners hebben Git Bash).
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # fetch_data.py draait hier volledig tegen een nagebootste keten met opgeslagen
      # testdata: geen netwerk, geen sleutel. PYTHONUTF8 omdat de logregels pijltjes (→) bevatten
      # (op Windows is de standaardtekenset anders, daar zou dat zonder deze regel breken).
      #
      # `2>&1 | tee python-tests.log`: de uitvoer gaat naar de log zoals altijd, EN naar een
      # bestand dat de samenvattingsstap onderaan inleest. unittest schrijft naar stderr, vandaar
      # `2>&1` (stderr naar stdout) vóór de pijp. LET OP: een pijp geeft normaal de exitcode van het
      # LAATSTE commando terug (tee, dat altijd slaagt), waardoor een falende test onzichtbaar
      # zou worden. `defaults.run.shell: bash` hierboven start bash met `-eo pipefail`: dan telt
      # de exitcode van het eerste commando die faalt, en wordt de stap dus gewoon rood.
      # (Zonder expliciete `shell: bash` gebruikt GitHub alleen `bash -e`, zonder pipefail.)
      - name: Python tests (fetch_data.py against a fake chain)
        id: py                  # met een id kan de samenvattingsstap `steps.py.outcome` lezen
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests 2>&1 | tee python-tests.log

      # `--test-reporter=tap`: de uitvoer heeft zo op Node 22 en 24 en bij elke terminal dezelfde
      # vorm (zonder deze vlag hangt de standaardreporter af van of de uitvoer naar een scherm gaat).
      - name: JS tests (browser modules)
        id: js
        run: node --test --test-reporter=tap tests/js/browser_modules.test.mjs tests/js/daily_history.test.mjs 2>&1 | tee js-tests.log

      # De tests hierboven laden maar een paar modules; een typefout in bijvoorbeeld canvas.js
      # zou ze allemaal laten slagen. Een syntaxcontrole van ELK bestand vangt dat wel.
      # Alle fouten worden getoond (niet alleen de eerste), daarna pas faalt de stap.
      - name: Syntax check of every browser module
        id: syntax
        run: |
          fail=0
          for f in modules/*.js; do
            node --check "$f" || fail=1
          done
          exit $fail

      - name: Compile every Python file
        id: compile
        run: git ls-files '*.py' | xargs python -m py_compile

      # SAMENVATTING OP DE RUN-PAGINA. Alles wat een stap naar het bestand $GITHUB_STEP_SUMMARY
      # schrijft, rendert GitHub als markdown bovenaan de run-pagina (Actions → de run). Zo zie je
      # in één blik hoeveel tests slaagden en bij een fout welke test, met verwacht/werkelijk,
      # zonder door de log te zoeken. Het parsen zit in tools/ci_summary.py, met eigen tests.
      #
      # `if: always()`: standaard slaat GitHub alle stappen na een gefaalde stap over. Juist bij
      # falen wil je de samenvatting, dus deze stap draait altijd (ook bij annuleren). De
      # `outcome` van een stap (success / failure / skipped / cancelled) komt uit de stap-id's
      # hierboven; het script gebruikt die naast de log, zodat een stap die faalde zonder iets
      # leesbaars in de log nooit groen in de tabel staat.
      # `continue-on-error`: een fout in het samenvatten zelf mag de job nooit rood maken.
      # Waarden gaan via `env` en niet rechtstreeks in het commando: zo kan een label met een
      # aanhalingsteken of `$(...)` nooit als shellcode worden uitgevoerd.
      - name: Summary on the run page
        if: always()
        continue-on-error: true
        env:
          LABEL: ${{ matrix.label }}
          PY_OUTCOME: ${{ steps.py.outcome }}
          JS_OUTCOME: ${{ steps.js.outcome }}
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
        run: |
          python tools/ci_summary.py --label "$LABEL" \
            --python-log python-tests.log --python-outcome "$PY_OUTCOME" \
            --js-log js-tests.log --js-outcome "$JS_OUTCOME" \
            --step "Syntax check of every browser module=$SYNTAX_OUTCOME" \
            --step "Compile every Python file=$COMPILE_OUTCOME"
