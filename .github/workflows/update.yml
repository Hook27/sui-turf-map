name: Update map data

on:
  schedule:
    # 6×/dag (elke 4 uur). Onderbouwing, allemaal GEMETEN aan de Ankr-teller:
    #   Ankr freemium ≈ 1,1 mln requests/maand (reset op de 1e). Een run kostte
    #   ~8.700 calls, dus 6×/dag (186 runs ≈ 155%) liep halverwege augustus 2026
    #   leeg. Sinds de caches in fetch_data.py (field_cache.json + hergebruik van
    #   de coördinaat→turf-id-mapping) kost een run nog ~2.100 — gemeten 19-08 aan
    #   een schoon 24-uursvenster met precies 3 runs: 6.403 / 3. Daarmee kost
    #   6×/dag ≈ 186 runs ≈ 390k requests ≈ 35% van het quotum.
    #   Meet het opnieuw met een venster dat ALLEEN runs van dezelfde soort bevat;
    #   uit een gemengd venster aftrekken gaf een fors te hoge uitkomst.
    #
    # Er stond hier tijdelijk een tweede regel die via het MAANDVELD in augustus
    # naar 1×/dag terugschakelde; die noodgreep is op 18-08-2026 opgeruimd toen de
    # besparing gemeten was. Ga je ooit terug naar zoiets: gebruik dan het
    # maandveld (bv. '0 5 * 8 *' náást '0 */8 * 1-7,9-12 *') en let erop dat je bij
    # het opruimen ALLEBEI de regels aanpakt — laat je '1-7,9-12' staan, dan draait
    # de kaart in augustus helemaal niet meer en merk je dat pas een maand later.
    #
    # LET OP: '0 */7 * * *' is GEEN cyclus van 7 uur — cron vuurt dan op 0/7/14/21
    # en dus 4× per dag. Een 7-uurscyclus bestaat niet in cron, want 24 is geen
    # veelvoud van 7.
    #
    # De MINUUT is bewust 22 en niet 0 (gewijzigd 27-08-2026). GitHub plant
    # geplande workflows op best effort en :00 is de drukste minuut van het
    # platform. Gemeten over 25-27 aug: ELKE run startte 37-66 min te laat, met
    # uitschieters van 108 en 196 min, en in de nacht van 26 op 27 aug werden TWEE
    # slots (00:00 en 04:00 UTC) helemaal overgeslagen — de kaart stond toen 9,5 uur
    # stil. Geen enkele run was mislukt; het is puur de inplanning. Zie je dit
    # terugkomen, kijk dan naar de STARTTIJDEN (gh run list), niet naar fetch_data.py:
    # cron en Ankr waren beide in orde.
    #
    # TERUGGEBRACHT VAN 6× NAAR 2×/DAG (29-08-2026). Sinds de Pi-cron de workflow
    # via workflow_dispatch aantrekt, is dit blok nog uitsluitend VANGNET voor het
    # geval de Pi stilvalt. Zes schedule-slots naast zes Pi-slots leverden twee
    # kwalen op: ruis in de runlijst, en — belangrijker — echte dubbele fetches.
    # De versheidspoort hieronder grijpt namelijk alleen als de late schedule-run
    # BINNEN een uur na de Pi-run binnenkomt. Gemeten 28/29-08: #902 kwam 111 min
    # te laat en #905 148 min, allebei ruim buiten het uur, dus allebei een
    # volledige tweede fetch (~2.100 calls elk). Met 2×/dag is dat hoogstens twee
    # keer per dag in plaats van zes.
    # Valt de Pi uit, dan ververst de kaart nog steeds 2× per dag; dat is de prijs
    # van het vangnet en bewust geaccepteerd (de bots lezen deze data, maar die
    # liggen bij een Pi-storing tóch stil).
    - cron: '22 */12 * * *'
  workflow_dispatch:
    inputs:
      src:
        # De cron op de Pi zet hier 'pi-cron' in; handmatig starten laat het leeg.
        # De poort hieronder slaat een run over als de data nog vers is, MAAR nooit
        # bij een handmatige dispatch — dan wil je juist forceren.
        description: "Herkomst van de trigger ('pi-cron' = geautomatiseerd; leeg = handmatig)"
        required: false
        default: ''

permissions:
  contents: write

# Twee triggers (de cron op de Pi én het schedule-blok hierboven) kunnen vlak na
# elkaar vuren. Serialiseren i.p.v. annuleren: een lopende fetch afkappen laat
# field_cache.json half bijgewerkt achter.
concurrency:
  group: update-map-data
  cancel-in-progress: false

jobs:
  # ── Versheidspoort ────────────────────────────────────────────────────────
  # Sinds 28-08-2026 trekt een cron op de Pi de workflow aan met workflow_dispatch,
  # omdat GitHub `schedule`-runs op best effort inplant: gemeten 25-28 aug liepen ze
  # 37-66 min achter en werden 4 van de 5 slots overgeslagen. Het schedule-blok staat
  # er nog als vangnet — dus kunnen beide vuren. Deze poort maakt de tweede gratis:
  # is data.json jonger dan 3 uur, dan stopt de run vóór de fetch. Een HANDMATIGE
  # dispatch (lege `src`) gaat altijd door.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SRC: ${{ github.event.inputs.src }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ -z "$SRC" ]; then
            echo "handmatige dispatch — altijd draaien"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          api="https://api.github.com/repos/${{ github.repository }}/commits?path=data.json&per_page=1"
          json=$(curl -sS --max-time 30 -H "Authorization: Bearer $GH_TOKEN" "$api")
          last=$(printf '%s' "$json" | python3 -c "import json,sys; print(json.load(sys.stdin)[0]['commit']['committer']['date'])")
          age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
          echo "data.json is $((age / 60)) min oud (laatste commit $last)"
          # De drempel hangt af van WIE er aanklopt (gewijzigd 01-09-2026).
          #
          # pi-cron (1 uur). Dit is de motor: die moet zijn ronde van 4 uur kunnen
          # draaien en mag alleen wijken voor een dubbele trigger op hetzelfde slot.
          # Stond eerst op 3 uur voor iedereen, met de redenering 'ruim onder de cadans
          # van 4 uur'. Dat gaat mis zodra er een run BUITEN het ritme is geweest: op
          # 28-08 zette een handmatige run om 11:27 de klok opnieuw, waarna de cron van
          # 14:22 werd geweigerd op 175 min < 180 — en de kaart 7 uur oud werd. Liever
          # een keer een dubbele fetch dan een gemiste ronde: de bots lezen deze data.
          #
          # schedule (3,5 uur). Sinds de Pi de kaart aanstuurt is dit blok nog uitsluitend
          # VANGNET, en een vangnet hoort alleen te vangen als er iets valt. Met één
          # drempel van een uur was dat een loterij: GitHub levert de twee slots 4,4 tot
          # 6,8 uur te laat (gemeten 29-08 t/m 01-09), en of zo'n run dan binnen of buiten
          # het uur na de laatste Pi-run landt is toeval — #930 werd afgewezen op 56 min,
          # #922 kwam erdoor op 74 min. 2 van de 7 fetchten zonder dat er iets mis was.
          # Op 3,5 uur komt een schedule-run alleen nog door als de Pi echt een slot van
          # 4 uur heeft gemist, en dat is precies waarvoor hij er staat.
          if [ "$EVENT" = "schedule" ]; then
            max_age=12600   # 3,5 uur
          else
            max_age=3600    # 1 uur
          fi
          echo "drempel voor $EVENT: $((max_age / 60)) min"
          if [ "$age" -lt "$max_age" ]; then
            echo "nog vers — deze run stopt hier (dubbele trigger)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  fetch:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch blockchain data
        env:
          SUI_RPC_URL: ${{ secrets.SUI_RPC_URL }}
        run: python fetch_data.py

      - name: Commit and push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch hq_captures.json free_turf_attacks.json owned_turf_attacks.json
          git add data.json history.json snapshots/ hq_captures.json player_history.json raids.json player_activity.json player_history_daily.json hq_destroyed.json free_turf_attacks.json owned_turf_attacks.json field_cache.json
          git status
          git diff --staged --quiet || (git commit -m "Update map data $(date -u +'%Y-%m-%d %H:%M UTC')" && git pull --rebase && git push)
