name: Update map data

on:
  schedule:
    # Ankr-quotum: op 17-08 stond de teller op 80% bij 6 runs/dag → ~0,83% per run,
    # dus ~120 runs/maand. Bij 6×/dag (186/maand) loop je halverwege de maand leeg.
    # Het MAANDVELD van cron schakelt hieronder vanzelf om, dus er is niets te
    # onthouden: augustus 1×/dag (quotum al grotendeels op), daarna 3×/dag = 93
    # runs/maand ≈ 78% met marge.
    # LET OP: '0 */7 * * *' is GEEN cyclus van 7 uur — cron vuurt dan op 0/7/14/21
    # en dus 4× per dag (~103% van het quotum). Een 7-uurscyclus bestaat niet in
    # cron, want 24 is geen veelvoud van 7.
    #
    # ⚠ DE AUGUSTUSREGEL MAG WEG, en hoort dat eigenlijk ook. Hij loste een krapte
    # op die door 6×/dag ontstond; op 3×/dag zit je ELKE maand op ~78%, augustus
    # incluis. Laat je hem staan, dan zakt de kaart één maand per jaar zonder
    # aanleiding terug naar 1×/dag. Geen haast: de regel slaapt van september t/m
    # juli. Beslisregel — kijk rond 20 september naar de Ankr-teller: staat die op
    # ~55-60% (twee derde maand op 78%-tempo), dan klopt de rekensom en kan hij weg;
    # staat hij hoger, dan verbruikt er iets anders mee en wil je de noodrem houden.
    #
    # ⚠⚠ HAAL ZE DAN ALLEBEI AAN: schrap de eerste regel ÉN zet '1-7,9-12' in de
    # tweede terug naar '*'. Doe je alleen het eerste, dan draait de kaart in
    # augustus HELEMAAL NIET meer — en dat merk je pas een maand later.
    #   resultaat:  - cron: '0 */8 * * *'
    - cron: '0 5 * 8 *'            # augustus: 1×/dag, 05:00 UTC (07:00 NL)
    - cron: '0 */8 * 1-7,9-12 *'   # rest van het jaar: 3×/dag (00/08/16 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch blockchain data
        env:
          SUI_RPC_URL: ${{ secrets.SUI_RPC_URL }}
        run: python fetch_data.py

      - name: Commit and push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch hq_captures.json free_turf_attacks.json owned_turf_attacks.json
          git add data.json history.json snapshots/ hq_captures.json player_history.json raids.json player_activity.json player_history_daily.json hq_destroyed.json free_turf_attacks.json owned_turf_attacks.json field_cache.json
          git status
          git diff --staged --quiet || (git commit -m "Update map data $(date -u +'%Y-%m-%d %H:%M UTC')" && git pull --rebase && git push)
